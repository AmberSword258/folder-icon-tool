name: CI

# 说明：本工具是 Windows PowerShell 5.1 + .NET Framework 的桌面应用，
# 因此 CI 必须用 `powershell`（5.1）而不是 `pwsh`（PowerShell 7）来验证。
# 在 PS7 下 Add-Type 的行为不同，且都不代表真实用户环境：
#   1. -ReferencedAssemblies 会覆盖默认引用集，导致 System.Linq 缺失
#   2. System.Drawing 的 Bitmap 被转发到 NuGet 包 System.Drawing.Common
# 详见 README 的「开发」一节。

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 语法检查与核心引擎编译
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确认运行环境
        shell: powershell
        run: |
          Write-Host "PowerShell 版本: $($PSVersionTable.PSVersion)  版本类型: $($PSVersionTable.PSEdition)"
          Write-Host "CLR: $([System.Environment]::Version)"
          if ($PSVersionTable.PSEdition -ne 'Desktop') {
            Write-Host "::error::本工具面向 Windows PowerShell 5.1（Desktop 版），当前不是该环境"
            exit 1
          }

      - name: 检查 PowerShell 脚本语法
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null; $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "::error file=$($_.Name)::$($errors.Count) 处语法错误"
              $errors | Select-Object -First 10 | ForEach-Object {
                Write-Host "  第 $($_.Extent.StartLineNumber) 行: $($_.Message)"
              }
              $failed = $true
            } else {
              Write-Host "OK  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: 校验 .ps1 文件带 UTF-8 BOM
        shell: powershell
        run: |
          # Windows PowerShell 5.1 读取无 BOM 的 UTF-8 文件会按 ANSI 解析，
          # 导致中文字符串乱码并直接语法报错，因此必须强制检查。
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $hasBom = $bytes.Length -ge 3 -and
                      $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            if ($hasBom) {
              Write-Host "OK  $($_.Name) 带 BOM"
            } else {
              Write-Host "::error file=$($_.Name)::缺少 UTF-8 BOM，Windows PowerShell 5.1 下会乱码"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: 编译核心引擎
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Path .\FolderIcon.Core.cs `
            -ReferencedAssemblies System.Drawing, System.Windows.Forms
          Write-Host "核心引擎编译通过"

          # 确认关键类型都存在
          $required = @(
            'FolderIconTool.PeInspector',
            'FolderIconTool.IconExtractor',
            'FolderIconTool.IcoWriter',
            'FolderIconTool.CandidateFinder',
            'FolderIconTool.FolderIconManager'
          )
          foreach ($t in $required) {
            if (-not ($t -as [type])) { Write-Host "::error::缺少类型 $t"; exit 1 }
            Write-Host "OK  $t"
          }

      - name: 冒烟测试（PE 解析 / 图标提取 / ICO 结构）
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Path .\FolderIcon.Core.cs `
            -ReferencedAssemblies System.Drawing, System.Windows.Forms

          # 1) PE 解析：notepad.exe 应被识别为图形界面程序
          $pe = [FolderIconTool.PeInspector]::Inspect("$env:WINDIR\System32\notepad.exe")
          if (-not $pe.IsValidPe) { Write-Host "::error::PE 解析失败"; exit 1 }
          Write-Host "PE 子系统: $($pe.Subsystem)  64位: $($pe.Is64Bit)"
          if ($pe.Subsystem -ne 'WindowsGui') {
            Write-Host "::error::notepad.exe 应被识别为图形界面程序"; exit 1
          }

          # 2) 图标提取：应为多尺寸，且包含小尺寸
          $imgs = [FolderIconTool.IconExtractor]::ExtractMultiSize("$env:WINDIR\System32\notepad.exe")
          if ($imgs.Count -eq 0) { Write-Host "::error::未能提取到任何图标尺寸"; exit 1 }
          Write-Host "提取尺寸: $(($imgs.Keys | Sort-Object) -join ', ')"
          if (-not $imgs.ContainsKey(16) -or -not $imgs.ContainsKey(32)) {
            Write-Host "::error::缺少 16/32 尺寸，资源管理器小图标视图会不清晰"; exit 1
          }

          # 3) 写出 ICO 并校验结构
          $ico = Join-Path $env:TEMP 'ci-test.ico'
          [FolderIconTool.IcoWriter]::Write($ico, $imgs)
          $bytes = [System.IO.File]::ReadAllBytes($ico)
          if ([BitConverter]::ToUInt16($bytes, 0) -ne 0) { Write-Host "::error::ICO reserved 字段错误"; exit 1 }
          if ([BitConverter]::ToUInt16($bytes, 2) -ne 1) { Write-Host "::error::ICO type 字段错误"; exit 1 }
          $count = [BitConverter]::ToUInt16($bytes, 4)
          Write-Host "ICO 包含 $count 个图像，共 $($bytes.Length) 字节"
          if ($count -ne $imgs.Count) { Write-Host "::error::ICO 图像数与提取尺寸数不一致"; exit 1 }

          # 4) 回读校验
          $icon = New-Object System.Drawing.Icon($ico, 32, 32)
          Write-Host "回读成功: $($icon.Width)x$($icon.Height)"
          $icon.Dispose()
          foreach ($k in $imgs.Keys) { $imgs[$k].Dispose() }

          Write-Host "冒烟测试全部通过"

      - name: 候选识别逻辑测试
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Path .\FolderIcon.Core.cs `
            -ReferencedAssemblies System.Drawing, System.Windows.Forms

          # 构造临时目录，验证识别逻辑的两个关键分支
          $root = Join-Path $env:TEMP 'fw-ci-cases'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root | Out-Null

          # 用例1：只有卸载程序 -> 不应自动判定
          $c1 = Join-Path $root 'CaseUninstaller'
          New-Item -ItemType Directory -Path $c1 | Out-Null
          Copy-Item "$env:WINDIR\System32\notepad.exe" (Join-Path $c1 'uninstall.exe')

          # 用例2：同名程序 -> 应自动判定
          $c2 = Join-Path $root 'notepad'
          New-Item -ItemType Directory -Path $c2 | Out-Null
          Copy-Item "$env:WINDIR\System32\notepad.exe" (Join-Path $c2 'notepad.exe')

          $fails = 0

          $cands1 = @([FolderIconTool.CandidateFinder]::Find($c1, 2))
          $explain1 = ''
          $ok1 = [FolderIconTool.CandidateFinder]::IsConfident($cands1, [ref]$explain1)
          Write-Host "用例1（只有 uninstall.exe）: 可信=$ok1  说明=$explain1"
          if ($ok1) { Write-Host "::error::只有卸载程序的文件夹不应被自动判定"; $fails++ }

          $cands2 = @([FolderIconTool.CandidateFinder]::Find($c2, 2))
          $explain2 = ''
          $ok2 = [FolderIconTool.CandidateFinder]::IsConfident($cands2, [ref]$explain2)
          Write-Host "用例2（notepad.exe 位于 notepad\ 内）: 可信=$ok2  说明=$explain2"
          if (-not $ok2) { Write-Host "::error::同名程序应被自动判定为可信"; $fails++ }

          Remove-Item $root -Recurse -Force
          if ($fails -gt 0) { exit 1 }
          Write-Host "候选识别逻辑测试通过"
