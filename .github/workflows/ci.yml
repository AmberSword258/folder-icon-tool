name: CI

# NOTE: This workflow is intentionally ASCII-only.
#
# Why: the runner writes each `run:` block to a temp file and executes it with
# Windows PowerShell 5.1. Non-ASCII characters in that path have proven fragile
# (they showed up mangled in the logs and broke a step unconditionally).
# Keeping the workflow ASCII-only removes that whole class of problem.
#
# Why PowerShell 5.1 (`shell: powershell`) and NOT PowerShell 7 (`shell: pwsh`):
# this project is a .NET Framework desktop app that targets Windows PowerShell 5.1.
# Under PS7 `Add-Type` behaves differently, in ways that do NOT reflect the real
# user environment:
#   1. -ReferencedAssemblies overrides the default reference set, dropping System.Linq
#      -> error CS0234: The type or namespace name 'Linq' does not exist
#   2. System.Drawing's Bitmap is type-forwarded to the NuGet package System.Drawing.Common
#      -> error CS1069: 'Bitmap' ... forwarded to 'System.Drawing.Common'
#
# The user-facing docs are written in Chinese; see README.md and the
# Chinese manual (filename: the Chinese word for "user guide" + .md).

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Syntax check and core engine build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runtime is Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion) / $($PSVersionTable.PSEdition)"
          Write-Host "CLR $([System.Environment]::Version)"
          if ($PSVersionTable.PSEdition -ne 'Desktop') {
            Write-Host "::error::This project targets Windows PowerShell 5.1 (Desktop edition)."
            exit 1
          }
          Write-Host "OK: running on Windows PowerShell 5.1"

      - name: Check PowerShell syntax
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null; $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "::error file=$($_.Name)::$($errors.Count) syntax error(s)"
              $errors | Select-Object -First 10 | ForEach-Object {
                Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)"
              }
              $failed = $true
            } else {
              Write-Host "OK  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Verify .ps1 files carry a UTF-8 BOM
        shell: powershell
        run: |
          # Windows PowerShell 5.1 parses BOM-less UTF-8 files as ANSI, which
          # mangles the Chinese strings in this project and breaks parsing.
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $hasBom = $bytes.Length -ge 3 -and
                      $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            if ($hasBom) {
              Write-Host "OK  $($_.Name) has BOM"
            } else {
              Write-Host "::error file=$($_.Name)::missing UTF-8 BOM (would be mangled on PowerShell 5.1)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Build core engine
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Path .\FolderIcon.Core.cs `
            -ReferencedAssemblies System.Drawing, System.Windows.Forms
          Write-Host "Core engine compiled"

          $required = @(
            'FolderIconTool.PeInspector',
            'FolderIconTool.IconExtractor',
            'FolderIconTool.IcoWriter',
            'FolderIconTool.CandidateFinder',
            'FolderIconTool.FolderIconManager'
          )
          foreach ($t in $required) {
            if (-not ($t -as [type])) { Write-Host "::error::missing type $t"; exit 1 }
            Write-Host "OK  $t"
          }

      - name: Smoke test - PE parsing, icon extraction, ICO structure
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Path .\FolderIcon.Core.cs `
            -ReferencedAssemblies System.Drawing, System.Windows.Forms

          $notepad = "$env:WINDIR\System32\notepad.exe"

          # 1) PE parsing: notepad.exe must be detected as a GUI application
          $pe = [FolderIconTool.PeInspector]::Inspect($notepad)
          if (-not $pe.IsValidPe) { Write-Host "::error::PE parsing failed"; exit 1 }
          Write-Host "PE subsystem: $($pe.Subsystem)  64-bit: $($pe.Is64Bit)"
          if ($pe.Subsystem -ne 'WindowsGui') {
            Write-Host "::error::notepad.exe should be detected as a GUI application"
            exit 1
          }

          # 2) Icon extraction: must yield multiple sizes including small ones
          $imgs = [FolderIconTool.IconExtractor]::ExtractMultiSize($notepad)
          if ($imgs.Count -eq 0) { Write-Host "::error::no icon frames extracted"; exit 1 }
          Write-Host "Extracted sizes: $(($imgs.Keys | Sort-Object) -join ', ')"
          if (-not $imgs.ContainsKey(16) -or -not $imgs.ContainsKey(32)) {
            Write-Host "::error::missing 16/32 px frames (small-icon views would look bad)"
            exit 1
          }

          # 3) ICO structure
          $ico = Join-Path $env:TEMP 'ci-test.ico'
          [FolderIconTool.IcoWriter]::Write($ico, $imgs)
          $bytes = [System.IO.File]::ReadAllBytes($ico)
          if ([BitConverter]::ToUInt16($bytes, 0) -ne 0) { Write-Host "::error::bad ICO reserved field"; exit 1 }
          if ([BitConverter]::ToUInt16($bytes, 2) -ne 1) { Write-Host "::error::bad ICO type field"; exit 1 }
          $count = [BitConverter]::ToUInt16($bytes, 4)
          Write-Host "ICO holds $count frames, $($bytes.Length) bytes"
          if ($count -ne $imgs.Count) { Write-Host "::error::ICO frame count mismatch"; exit 1 }

          # 4) Read back through the shell API path
          $icon = New-Object System.Drawing.Icon($ico, 32, 32)
          Write-Host "Read back: $($icon.Width)x$($icon.Height)"
          $icon.Dispose()
          foreach ($k in $imgs.Keys) { $imgs[$k].Dispose() }

          Write-Host "Smoke test passed"

      - name: Test candidate detection logic
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -Path .\FolderIcon.Core.cs `
            -ReferencedAssemblies System.Drawing, System.Windows.Forms

          $root = Join-Path $env:TEMP 'fw-ci-cases'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root | Out-Null

          # Case 1: only an uninstaller -> must NOT be auto-selected
          $c1 = Join-Path $root 'CaseUninstaller'
          New-Item -ItemType Directory -Path $c1 | Out-Null
          Copy-Item "$env:WINDIR\System32\notepad.exe" (Join-Path $c1 'uninstall.exe')

          # Case 2: name matches the folder -> should be auto-selected
          $c2 = Join-Path $root 'notepad'
          New-Item -ItemType Directory -Path $c2 | Out-Null
          Copy-Item "$env:WINDIR\System32\notepad.exe" (Join-Path $c2 'notepad.exe')

          $fails = 0

          $cands1 = @([FolderIconTool.CandidateFinder]::Find($c1, 2))
          $explain1 = ''
          $ok1 = [FolderIconTool.CandidateFinder]::IsConfident($cands1, [ref]$explain1)
          Write-Host "Case 1 (only uninstall.exe): confident=$ok1  reason=$explain1"
          if ($ok1) { Write-Host "::error::an uninstaller-only folder must not be auto-selected"; $fails++ }

          $cands2 = @([FolderIconTool.CandidateFinder]::Find($c2, 2))
          $explain2 = ''
          $ok2 = [FolderIconTool.CandidateFinder]::IsConfident($cands2, [ref]$explain2)
          Write-Host "Case 2 (notepad.exe inside notepad\): confident=$ok2  reason=$explain2"
          if (-not $ok2) { Write-Host "::error::a name-matching executable should be auto-selected"; $fails++ }

          Remove-Item $root -Recurse -Force
          if ($fails -gt 0) { exit 1 }
          Write-Host "Candidate detection tests passed"
